<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <title>Teleprompter Plus</title>
  <desc>Brand mark: prompter screen with an active reading line and a left eyeline caret</desc>
  <!-- Prompter screen -->
  <rect x="5" y="4" width="16" height="15" rx="2"/>
  <!-- Text lines: faded (read / upcoming) with the active reading line at full strength -->
  <line x1="9" y1="8" x2="16" y2="8" opacity="0.45"/>
  <line x1="9" y1="11.5" x2="18" y2="11.5"/>
  <line x1="9" y1="15" x2="14" y2="15" opacity="0.45"/>
  <!-- Eyeline caret pointing at the active line (the app's voice-tracked reading position) -->
  <path d="M1.5 11.5 L4.5 9.8 L4.5 13.2 Z" fill="currentColor" stroke="none"/>
</svg>
