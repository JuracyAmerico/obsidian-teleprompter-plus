<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Teleprompter Plus">
  <title>Teleprompter Plus</title>

  <!-- Outer dashed ring (Tron/Stream-Deck aesthetic) -->
  <circle cx="128" cy="128" r="116" fill="none" stroke="#00d4ff" stroke-width="6" stroke-dasharray="12 8" />

  <!-- Subtle inner ring for depth -->
  <circle cx="128" cy="128" r="100" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.35" />

  <!-- T mark (cyan) - the brand letter -->
  <rect x="56"  y="76"  width="100" height="20" fill="#00d4ff" rx="3" />
  <rect x="96"  y="76"  width="20"  height="120" fill="#00d4ff" rx="3" />

  <!-- Plus mark (orange) - the "enhanced" indicator -->
  <rect x="148" y="120" width="60" height="14" fill="#FF6B00" rx="2" />
  <rect x="171" y="97"  width="14" height="60" fill="#FF6B00" rx="2" />

  <!-- Bottom accent dot - signals "active / live" -->
  <circle cx="128" cy="216" r="3" fill="#FF6B00" />
</svg>
